name: Deploy CloudFormation Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'cloudformation/**'
      - '.github/workflows/deploy.yaml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  id-token: write   # required for OIDC token generation
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  CFN_BUCKET: ${{ vars.CFN_BUCKET }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  STACK_NAME: cfn-demo-infrastructure
  TEMPLATE_FILE: cloudformation/infrastructure.yaml
  PARAMETERS_FILE: cloudformation/parameters.json
  TAGS_FILE: cloudformation/tags.json
  CHANGESET_NAME: changeset-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Lint & Validate
  # ─────────────────────────────────────────────
  lint-and-validate:
    name: Lint & Validate Template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cfn-lint
        run: pip install cfn-lint

      - name: Run cfn-lint
        run: |
          echo "Running CloudFormation linter..."
          cfn-lint ${{ env.TEMPLATE_FILE }} --include-checks W
          echo "Lint passed."

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Validate-${{ github.run_id }}

      - name: Validate template against AWS
        run: |
          echo "Validating template with AWS CloudFormation..."
          aws cloudformation validate-template \
            --template-body file://${{ env.TEMPLATE_FILE }}
          echo "AWS validation passed."

  # ─────────────────────────────────────────────
  # JOB 2: Upload Template to S3
  # ─────────────────────────────────────────────
  upload-template:
    name: Upload Template to S3
    runs-on: ubuntu-latest
    needs: lint-and-validate
    outputs:
      template_s3_url: ${{ steps.upload.outputs.template_s3_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Upload-${{ github.run_id }}

      - name: Upload template to S3
        id: upload
        run: |
          S3_KEY="templates/${{ env.STACK_NAME }}/run-${{ github.run_id }}/infrastructure.yaml"
          S3_URL="https://${{ env.CFN_BUCKET }}.s3.${{ env.AWS_REGION }}.amazonaws.com/${S3_KEY}"

          echo "Uploading to s3://${{ env.CFN_BUCKET }}/${S3_KEY}..."
          aws s3 cp "${{ env.TEMPLATE_FILE }}" "s3://${{ env.CFN_BUCKET }}/${S3_KEY}"

          echo "Template S3 URL: ${S3_URL}"
          echo "template_s3_url=${S3_URL}" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────
  # JOB 3: Create Change Set
  # ─────────────────────────────────────────────
  create-changeset:
    name: Create Change Set
    runs-on: ubuntu-latest
    needs: upload-template
    outputs:
      changeset_status: ${{ steps.check-changeset.outputs.changeset_status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-ChangeSet-${{ github.run_id }}

      - name: Check if stack exists
        id: stack-check
        run: |
          if aws cloudformation describe-stacks --stack-name ${{ env.STACK_NAME }} 2>/dev/null; then
            echo "stack_exists=true" >> $GITHUB_OUTPUT
            echo "Stack exists — change set type: UPDATE"
          else
            echo "stack_exists=false" >> $GITHUB_OUTPUT
            echo "Stack does not exist — change set type: CREATE"
          fi

      - name: Create change set
        run: |
          CHANGESET_TYPE="UPDATE"
          if [ "${{ steps.stack-check.outputs.stack_exists }}" = "false" ]; then
            CHANGESET_TYPE="CREATE"
          fi

          TEMPLATE_URL="${{ needs.upload-template.outputs.template_s3_url }}"
          echo "Template URL: ${TEMPLATE_URL}"

          if [ -z "${TEMPLATE_URL}" ]; then
            echo "ERROR: template_s3_url output is empty. Check the upload-template job."
            exit 1
          fi

          echo "Creating change set '${{ env.CHANGESET_NAME }}' (type: ${CHANGESET_TYPE})..."
          aws cloudformation create-change-set \
            --stack-name "${{ env.STACK_NAME }}" \
            --change-set-name "${{ env.CHANGESET_NAME }}" \
            --change-set-type "${CHANGESET_TYPE}" \
            --template-url "${TEMPLATE_URL}" \
            --parameters "file://${{ env.PARAMETERS_FILE }}" \
            --tags "file://${{ env.TAGS_FILE }}" \
            --capabilities CAPABILITY_NAMED_IAM

          echo "Waiting for change set to be ready..."
          aws cloudformation wait change-set-create-complete \
            --stack-name "${{ env.STACK_NAME }}" \
            --change-set-name "${{ env.CHANGESET_NAME }}" || true

      - name: Check change set status
        id: check-changeset
        run: |
          STATUS=$(aws cloudformation describe-change-set \
            --stack-name ${{ env.STACK_NAME }} \
            --change-set-name ${{ env.CHANGESET_NAME }} \
            --query 'Status' --output text)

          REASON=$(aws cloudformation describe-change-set \
            --stack-name ${{ env.STACK_NAME }} \
            --change-set-name ${{ env.CHANGESET_NAME }} \
            --query 'StatusReason' --output text)

          echo "Change set status: ${STATUS}"
          echo "Reason: ${REASON}"
          echo "changeset_status=${STATUS}" >> $GITHUB_OUTPUT

          if [ "${STATUS}" = "FAILED" ]; then
            if echo "${REASON}" | grep -q "didn't contain changes"; then
              echo "No changes detected — skipping deployment."
            else
              echo "Change set creation failed: ${REASON}"
              exit 1
            fi
          fi

      - name: Print change set details
        run: |
          echo "===== Change Set Summary ====="
          aws cloudformation describe-change-set \
            --stack-name ${{ env.STACK_NAME }} \
            --change-set-name ${{ env.CHANGESET_NAME }} \
            --query 'Changes[*].{Action:ResourceChange.Action,Resource:ResourceChange.LogicalResourceId,Type:ResourceChange.ResourceType,Replacement:ResourceChange.Replacement}' \
            --output table || echo "No changes to display."

  # ─────────────────────────────────────────────
  # JOB 4: Execute Change Set
  # ─────────────────────────────────────────────
  deploy:
    name: Execute Change Set
    runs-on: ubuntu-latest
    needs: create-changeset
    if: needs.create-changeset.outputs.changeset_status != 'FAILED'
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Deploy-${{ github.run_id }}

      - name: Execute change set
        run: |
          echo "Executing change set '${{ env.CHANGESET_NAME }}'..."
          aws cloudformation execute-change-set \
            --stack-name ${{ env.STACK_NAME }} \
            --change-set-name ${{ env.CHANGESET_NAME }}

      - name: Wait for stack to stabilize
        run: |
          echo "Waiting for stack to reach COMPLETE state..."
          aws cloudformation wait stack-update-complete \
            --stack-name ${{ env.STACK_NAME }} 2>/dev/null || \
          aws cloudformation wait stack-create-complete \
            --stack-name ${{ env.STACK_NAME }}
          echo "Stack deployment complete."

  # ─────────────────────────────────────────────
  # JOB 5: Post-Deployment Verification
  # ─────────────────────────────────────────────
  post-deploy:
    name: Post-Deployment Verification
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-PostDeploy-${{ github.run_id }}

      - name: Verify stack is in a healthy state
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query 'Stacks[0].StackStatus' --output text)

          echo "Stack status: ${STATUS}"
          if [[ "${STATUS}" != *"COMPLETE"* ]]; then
            echo "Stack is not healthy: ${STATUS}"
            exit 1
          fi

      - name: Print stack outputs
        run: |
          echo "===== Stack Outputs ====="
          aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query 'Stacks[0].Outputs[*].{Key:OutputKey,Value:OutputValue,Description:Description}' \
            --output table

      - name: Verify Lambda function is active
        run: |
          LAMBDA_NAME=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaFunctionName'].OutputValue" \
            --output text)

          echo "Checking Lambda: ${LAMBDA_NAME}"
          STATE=$(aws lambda get-function \
            --function-name "${LAMBDA_NAME}" \
            --query 'Configuration.State' --output text)

          echo "Lambda state: ${STATE}"
          [ "${STATE}" = "Active" ] && echo "Lambda is healthy." || exit 1

      - name: Summary
        run: |
          echo "============================================"
          echo "  Deployment completed successfully!"
          echo "  Stack:  ${{ env.STACK_NAME }}"
          echo "  Region: ${{ env.AWS_REGION }}"
          echo "  Run ID: ${{ github.run_id }}"
          echo "  Commit: ${{ github.sha }}"
          echo "============================================"
